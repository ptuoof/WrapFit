name: WrapFit CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Check Project Structure
        run: |
          echo "Validating Workspace structure..."
          test -d fe
          test -d be
          test -d shared
          test -d .agents
          echo "All core directories present."
