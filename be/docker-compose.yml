version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wrapfit-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-wrapfit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wrapfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: be/Dockerfile
    container_name: wrapfit-api
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-wrapfit}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wrapfit_pgdata:
