services:
  # ===================================================
  # 1. PostgreSQL Database Service
  # ===================================================
  postgres:
    image: postgres:16-alpine
    container_name: wrapfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-wrapfit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wrapfit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wrapfit-network

  # ===================================================
  # 2. WrapFit Backend REST API (Express + Prisma + PDFKit)
  # ===================================================
  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    container_name: wrapfit-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-wrapfit}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - wrapfit-network

  # ===================================================
  # 3. WrapFit Frontend Studio (Next.js 14 + Three.js + Fabric.js)
  # ===================================================
  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-WrapFit Studio}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: wrapfit-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wrapfit-network

volumes:
  postgres_data:
    name: wrapfit_postgres_data
  uploads_data:
    name: wrapfit_uploads_data

networks:
  wrapfit-network:
    name: wrapfit-network
    driver: bridge
